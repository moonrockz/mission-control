name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: mise run lint

      - name: Validate package structure
        run: mise run validate

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.target }}
        run: mise run build -- ${{ matrix.target }} --release

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test ${{ matrix.target }}
        run: mise run test -- ${{ matrix.target }}

  build-windows:
    name: Build (windows-x64)
    needs: [lint]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install the pinned MoonBit toolchain
        uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'

      - name: Update the registry
        run: moon update

      - name: Build mission-control natively for Windows
        run: moon build apps/cli --target native --release

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: _build/native/release/build/moonrockz/mission-control-cli/mission-control-cli.exe
          if-no-files-found: error
          retention-days: 7

  cross-build:
    name: Cross-build release outputs
    runs-on: ubuntu-latest
    needs: [lint, build-windows]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the windows-x64 executable
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-exe
          path: _build/cross/windows-x64/native/release/build/moonrockz/mission-control-cli

      - name: Build the release outputs into dist/
        run: mise run build:release

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test-native-zig:
    name: Test native (zig)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the native tests with zig as the C compiler
        run: mise run test:native-zig

  test-scripts:
    name: Test task scripts
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the task script tests
        run: mise run test:scripts

  test-browser:
    name: Test browser (chromium, webkit, firefox)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The key follows the Playwright version that .config/mise/config.toml pins, and
      # names the three engines, so a cache with Chromium only is not reused.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-3-engines-${{ runner.os }}-${{ hashFiles('.config/mise/config.toml') }}

      - name: Run the OKF browser store checks in Chromium, WebKit and Firefox
        run: mise run test:browser -- --install

  # The only check that branch protection needs. Add every new job to `needs`.
  # `if: always()` is required: without it this job is skipped when a needed job fails, and
  # GitHub counts a skipped required check as passed.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, build, build-windows, test, cross-build, test-native-zig, test-scripts, test-browser]
    steps:
      - name: Check that every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Some CI jobs did not pass"
            echo "$failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
