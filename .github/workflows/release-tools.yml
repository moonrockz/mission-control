# Release the tools CLI (apps/tools): plan, validate, build-windows, build, smoke, release.
#
# The tools CLI has its own version (apps/tools/moon.mod), its own tags (tools-vX.Y.Z) and its own
# changelog (apps/tools/CHANGELOG.md). The main Release workflow (release.yml) does not build it, and its
# tag filter 'v*' does not match a tools-v tag.
#
# The flow:
#   plan           decides if this run releases. It writes release, dry_run, version and tag.
#   validate       runs lint, the tools tests and the version check of the tools family.
#   build-windows  builds the windows-x64 executable natively. A cross-built Windows binary reads its
#                  arguments wrongly.
#   build          cross-builds the other four, packs dist-tools/ and attests the six assets.
#   smoke          verifies the attestation of each archive and runs it on a runner of its OS.
#   release        creates the GitHub release tools-vX.Y.Z from the dist-tools artifact. It is never
#                  marked as the latest release, so releases/latest stays on the main CLI.
#
# This workflow has no pull_request or merge_group trigger. A manual run with dry_run runs plan, validate,
# build-windows, build (with the attestations) and smoke, and never creates a tag or a release.
# Re-run failed jobs after a transient failure: release uploads only the assets that are missing.

name: Release tools

on:
  push:
    branches: [main]
    paths:
      - apps/tools/moon.mod
      - apps/tools/CHANGELOG.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan, validate, build, attest and smoke check, but do not create a tag or a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-tools
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide what this run does
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: mise run release:tools-plan

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.release == 'true' || needs.plan.outputs.dry_run == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and validate
        run: |
          mise run lint
          mise run validate

      - name: Test the tools CLI and the OpenSpec extension on wasm and native
        run: |
          moon test apps/tools apps/openspec-ext tests/openspec-ext-acceptance --target wasm --deny-warn
          moon test apps/tools apps/openspec-ext tests/openspec-ext-acceptance --target native --deny-warn

      - name: Run the task script tests
        run: mise run test:scripts

      - name: Check that every tools version is ${{ needs.plan.outputs.version }}
        run: moonx scripts/versions.mbtx check-tools ${{ needs.plan.outputs.version }}

  build-windows:
    name: Build (windows-x64)
    needs: [plan]
    if: needs.plan.outputs.release == 'true' || needs.plan.outputs.dry_run == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install the pinned MoonBit toolchain
        uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.18+6c83a7f62'
          core-version: '0.10.18+6c83a7f62'

      - name: Update the registry
        run: moon update

      # The MoonBit runtime parts that moonbitlang/async uses (thread pool, event bus) compile only
      # with MSVC on Windows ("Currently only MSVC is supported on Windows"). Put cl.exe on PATH.
      - name: Set up the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build mission-control-tools natively for Windows
        run: moon build apps/tools --target native --release

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: tools-windows-x64-exe
          path: _build/native/release/build/moonrockz/mission-control-tools/mission-control-tools.exe
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build and attest
    runs-on: ubuntu-latest
    needs: [plan, build-windows]
    if: needs.plan.outputs.release == 'true' || needs.plan.outputs.dry_run == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the windows-x64 executable
        uses: actions/download-artifact@v4
        with:
          name: tools-windows-x64-exe
          path: _build/cross/windows-x64/native/release/build/moonrockz/mission-control-tools

      - name: Build the release outputs into dist-tools/
        run: mise run build:tools

      # A dry run attests too, so the dry run proves this step. Each attestation names its run.
      - name: Attest the five archives and checksums.txt
        uses: actions/attest@v4
        with:
          subject-path: |
            dist-tools/mission-control-tools-*
            dist-tools/checksums.txt

      - name: Upload dist-tools/
        uses: actions/upload-artifact@v4
        with:
          name: dist-tools
          path: dist-tools/
          if-no-files-found: error
          retention-days: 30

  # These runners only verify and run the binaries. They never build, so they need no mise. Each one
  # checks out the repository, so the binary can check the real Mission Control snapshot.
  smoke:
    name: Smoke (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    needs: [plan, build]
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x64
            archive: mission-control-tools-linux-x64.tar.gz
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
            archive: mission-control-tools-linux-arm64.tar.gz
          - runner: macos-latest
            asset: darwin-arm64
            archive: mission-control-tools-darwin-arm64.tar.gz
          - runner: macos-15-intel
            asset: darwin-x64
            archive: mission-control-tools-darwin-x64.tar.gz
          - runner: windows-latest
            asset: windows-x64
            archive: mission-control-tools-windows-x64.zip
    steps:
      # The managed files are compared byte for byte, so a CRLF checkout on Windows would be drift.
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dist-tools/
        uses: actions/download-artifact@v4
        with:
          name: dist-tools
          path: dist-tools

      - name: Verify the attestation of the archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh attestation verify "dist-tools/${{ matrix.archive }}"
          --repo "${{ github.repository }}"
          --signer-workflow "${{ github.repository }}/.github/workflows/release-tools.yml"

      - name: Unpack the archive (tar)
        if: matrix.asset != 'windows-x64'
        shell: bash
        run: |
          mkdir smoke
          tar -xzf "dist-tools/${{ matrix.archive }}" -C smoke

      - name: Unpack the archive (zip)
        if: matrix.asset == 'windows-x64'
        shell: pwsh
        run: Expand-Archive -Path "dist-tools/${{ matrix.archive }}" -DestinationPath smoke

      - name: Run version and the bundle check of this repository
        shell: bash
        env:
          EXPECTED: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          bin=smoke/mission-control-tools
          if [ "${{ matrix.asset }}" = "windows-x64" ]; then bin=smoke/mission-control-tools.exe; fi
          chmod +x "$bin" || true
          out="$("$bin" version)"
          echo "$out"
          if [ "$out" != "mission-control-tools $EXPECTED" ]; then
            echo "::error::mission-control-tools version did not print $EXPECTED"; exit 1
          fi
          "$bin" openspec check --bundle .
          "$bin" openspec check --json .

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [plan, validate, smoke]
    if: needs.plan.outputs.release == 'true'
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dist-tools/
        uses: actions/download-artifact@v4
        with:
          name: dist-tools
          path: dist-tools

      - name: Write the release notes
        run: mise run release:tools-notes ${{ needs.plan.outputs.version }} > "$RUNNER_TEMP/notes.md"

      - name: Create the release or upload the missing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:tools-github ${{ needs.plan.outputs.version }}
